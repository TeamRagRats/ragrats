services:
  postgres:
    image: paradedb/paradedb:16-v0.23.4
    container_name: ragrats_database
    restart: unless-stopped
    command: postgres -c shared_preload_libraries=pg_search
    env_file: ../../.env
    environment:
      POSTGRES_USER: teamragrats
      POSTGRES_PASSWORD: ragrats
      POSTGRES_DB: ragrats
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data
