services:
  docling:
    build:
      context: ../..
      dockerfile: docker/docling/Dockerfile
    container_name: ragrats_docling
    env_file: ../../.env
    networks:
      - postgres_default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONPATH=/app:/app/preprocessing
      - DATABASE_URL=postgresql://teamragrats:ragrats@ragrats_database:5432/ragrats
    command: ["sleep", "infinity"]
    volumes:
      - ../../data/attachment:/input:ro
      - ../../data:/output
      - ../../src/preprocessing:/app/preprocessing:ro
    shm_size: '16gb'

networks:
  postgres_default:
    external: true
